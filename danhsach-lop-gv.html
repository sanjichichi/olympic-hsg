<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh sách lớp học - Olympic HSG Online</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e9f0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: #eef4ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .logo-title {
            font-weight: bold;
            font-size: 16px;
        }

        .logo-sub {
            font-size: 12px;
            color: #7b8494;

            margin-top: 3px;
        }

        /* MAIN */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-header p {
            margin-top: 7px;
            color: #7d8798;
        }

        /* BUTTON */

        .btn-primary {
            border: none;
            background: #2468e8;
            color: white;

            padding: 12px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        .btn-primary:hover {
            background: #1858cf;
        }

        /* CLASS GRID */

        .class-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        /* CLASS CARD */

        .class-card {
            background: white;

            border: 1px solid #e5e9f0;

            border-radius: 17px;

            padding: 20px;

            transition: .2s;
        }

        .class-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(30,60,100,.08);
        }

        .class-icon {
            width: 48px;
            height: 48px;

            background: #eef4ff;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            margin-bottom: 15px;
        }

        .class-name {
            font-size: 19px;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .class-subject {
            color: #6f7b8e;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .class-info {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 18px;
        }

        .info-box {
            background: #f7f9fc;

            border-radius: 10px;

            padding: 10px;

            text-align: center;
        }

        .info-box strong {
            display: block;

            font-size: 17px;
        }

        .info-box span {
            font-size: 11px;

            color: #8993a3;
        }

        .class-code {
            background: #f5f8ff;

            padding: 10px;

            border-radius: 9px;

            font-size: 12px;

            margin-bottom: 15px;
        }

        .class-code strong {
            color: #2468e8;

            letter-spacing: 1px;
        }

        .btn-view {
            width: 100%;

            border: 1px solid #dce3ef;

            background: white;

            padding: 10px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            color: #2468e8;
        }

        .btn-view:hover {
            background: #f4f7ff;
        }

        /* MOBILE */

        @media(max-width: 800px) {

            .class-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media(max-width: 550px) {

            .header {
                padding: 0 15px;
            }

            .container {
                margin-top: 20px;
            }

            .page-header {
                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

            .class-grid {
                grid-template-columns: 1fr;
            }

        }

        .btn-back {
    border: 1px solid #dce3ef;
    background: white;
    color: #526078;

    padding: 9px 14px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 600;

    margin-right: 20px;
}

.btn-back:hover {
    background: #f4f7ff;
    color: #2468e8;
}
    </style>
</head>

<body>

<header class="header">
     <button
        class="btn-back"
        onclick="quayTrangGV()">
        ← Quay lại
    </button>

    <div class="logo">

        <div class="logo-icon">
            🏆
        </div>

        <div>

            <div class="logo-title">
                OLYMPIC HSG ONLINE
            </div>

            <div class="logo-sub">
                Học tập số • Sáng tạo • Vươn xa
            </div>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-header">

        <div>

            <h1>
                🏫 Danh sách lớp học
            </h1>

            <p>
                Quản lý các lớp học của bạn
            </p>

        </div>


        <button
            class="btn-primary"
            onclick="taoLop()">

            ＋ Tạo lớp mới

        </button>

    </div>


    <div
        id="classGrid"
        class="class-grid">
    </div>


</main>


<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzXRtrvbS2YpKDAZLwoV0cR1mFWHxlXljvNJzryHhFmnfOXZ3LzR0ai1cyltOF7l62hVQ/exec";

let danhSachLop = [];
/* =========================================================
   TẢI DANH SÁCH LỚP TỪ TAIKHOAN
   ========================================================= */

async function taiDanhSachLop() {

    const container =
        document.getElementById("classGrid");

    container.innerHTML = `
        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:40px;
            color:#64748b;
        ">
            ⏳ Đang tải danh sách lớp...
        </div>
    `;

    try {

        const url =
            API_URL +
            "?action=layDanhSachLop";

        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "API trả về HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                data.message ||
                "Không thể tải danh sách lớp."
            );
        }

        danhSachLop =
            Array.isArray(data.danhSachLop)
                ? data.danhSachLop
                : [];

        hienThiLop();

    } catch (error) {

        console.error(
            "Lỗi tải danh sách lớp:",
            error
        );

        container.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:40px;
                color:#dc2626;
            ">
                ❌ Không thể tải danh sách lớp.
                <br>
                <small>
                    ${error.message}
                </small>
            </div>
        `;
    }
}

function hienThiLop() {

    const container =
        document.getElementById(
            "classGrid"
        );


    container.innerHTML = "";


    danhSachLop.forEach(lop => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "class-card";


        card.innerHTML = `

            <div class="class-icon">
                📘
            </div>


            <div class="class-name">
                ${lop.ten}
            </div>


            <div class="class-subject">
                ${lop.mon}
            </div>


            <div class="class-info">

                <div class="info-box">

                    <strong>
                        ${lop.hocSinh}
                    </strong>

                    <span>
                        Học sinh
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        12
                    </strong>

                    <span>
                        Bài thi
                    </span>

                </div>

            </div>


            <div class="class-code">

                Mã lớp:

                <strong>
                    ${lop.maLop}
                </strong>

            </div>


            <button
                class="btn-view"
                onclick="vaoLop('${lop.id}')">

                Xem lớp →

            </button>

        `;


        container.appendChild(card);

    });

}


function vaoLop(id) {

    // Lưu ID nội bộ của lớp
    localStorage.setItem(
        "olympic_class_id",
        id
    );

    // Lưu tên lớp thật, ví dụ: 9A4
    const lop = danhSachLop.find(
        item => String(item.id) === String(id)
    );

    if (lop) {

        const tenLop = String(lop.ten || "")
            .replace(/^Lớp\s*/i, "")
            .trim();

        localStorage.setItem(
            "olympic_class_name",
            tenLop
        );
    }

    window.location.href = "lop-hoc-gv.html";
}

taiDanhSachLop();
function quayTrangGV() {

    window.location.href = "trang-gv.html";

}
</script>

</body>
</html>
