<script>

/*
 * ==========================================================
 * BẢNG XẾP HẠNG - 1 SHEET KETQUA CHUNG
 * ==========================================================
 *
 * Tất cả môn, tất cả khối, tất cả kỳ thi đều đọc từ
 * cùng một Sheet KETQUA.
 *
 * Hãy thay URL dưới đây bằng URL CSV của tab KETQUA.
 */
const KETQUA_CSV_URL =
    localStorage.getItem("KETQUA_CSV_URL") ||
    "DAN_URL_CSV_SHEET_KETQUA_VAO_DAY";

const namHocSelect =
    document.getElementById("locNamHoc");

const dotThiSelect =
    document.getElementById("locDotThi");

const examSelect =
    document.getElementById("filterExam");

const rankingBody =
    document.getElementById("rankingBody");

const tongThiSinh =
    document.getElementById("tongThiSinh");

let allResults = [];


/*
 * CSV parser hỗ trợ ô có dấu phẩy.
 */
function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {

            cell += '"';
            i++;
            continue;

        }

        if (char === '"') {

            inQuotes = !inQuotes;
            continue;

        }

        if (char === "," && !inQuotes) {

            row.push(cell);
            cell = "";
            continue;

        }

        if (
            (char === "\n" || char === "\r") &&
            !inQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell);
            cell = "";

            if (
                row.length > 1 ||
                row[0] !== ""
            ) {
                rows.push(row);
            }

            row = [];
            continue;

        }

        cell += char;

    }

    row.push(cell);

    if (
        row.length > 1 ||
        row[0] !== ""
    ) {
        rows.push(row);
    }

    return rows;
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function parseTG(tg) {

    if (!tg) return 999999;

    const p =
        String(tg).trim().split(":");

    if (p.length === 3) {

        return Number(p[0]) * 3600 +
               Number(p[1]) * 60 +
               Number(p[2]);

    }

    if (p.length === 2) {

        return Number(p[0]) * 60 +
               Number(p[1]);

    }

    return 999999;

}


/*
 * Chuyển dữ liệu Sheet thành object.
 */
function convertRows(rows) {

    if (!rows.length) return [];

    const header =
        rows[0].map(h =>
            String(h || "")
                .trim()
                .replace(/^\uFEFF/, "")
        );

    const index = {};

    header.forEach((name, i) => {
        index[name] = i;
    });

    const get = (row, name) => {

        const i = index[name];

        return i === undefined
            ? ""
            : String(row[i] ?? "").trim();

    };

    return rows.slice(1).map(row => ({

        maKyThi: get(row, "maKyThi"),
        maHS: get(row, "maHS"),
        hoTen: get(row, "hoTen"),
        lop: get(row, "lop"),
        tenKyThi: get(row, "tenKyThi"),
        khoi: get(row, "khoi"),
        mon: get(row, "mon"),
        diem: Number(get(row, "diem") || 0),
        thoiGian: get(row, "thoiGian"),
        roiTab: Number(get(row, "roiTab") || 0),
        dotThi: get(row, "dotThi"),
        namHoc: get(row, "namHoc"),
        ngayThi: get(row, "ngayThi")

    })).filter(item => item.maHS);

}


/*
 * Tạo danh sách lựa chọn.
 */
function fillSelect(select, values) {

    const current = select.value;

    select.innerHTML =
        '<option value="ALL">Tất cả</option>';

    [...values]
        .filter(v => String(v).trim() !== "")
        .sort((a, b) =>
            String(a).localeCompare(
                String(b),
                "vi"
            )
        )
        .forEach(value => {

            const option =
                document.createElement("option");

            option.value = value;
            option.textContent = value;

            select.appendChild(option);

        });

    if (
        [...select.options]
            .some(o => o.value === current)
    ) {
        select.value = current;
    }

}


/*
 * Cập nhật bộ lọc kỳ thi theo năm học + đợt thi.
 */
function updateExamFilter() {

    const namHoc =
        namHocSelect.value;

    const dotThi =
        dotThiSelect.value;

    const filtered =
        allResults.filter(item => {

            const okNam =
                namHoc === "ALL" ||
                item.namHoc === namHoc;

            const okDot =
                dotThi === "ALL" ||
                item.dotThi === dotThi;

            return okNam && okDot;

        });

    const exams = new Map();

    filtered.forEach(item => {

        /*
         * Dùng maKyThi làm khóa để các kỳ thi
         * trùng tên vẫn không bị gộp nhầm.
         */
        if (item.maKyThi) {

            exams.set(
                item.maKyThi,
                item.tenKyThi || item.maKyThi
            );

        }

    });

    const current =
        examSelect.value;

    examSelect.innerHTML =
        '<option value="ALL">Tất cả</option>';

    [...exams.entries()]
        .sort((a, b) =>
            String(a[1]).localeCompare(
                String(b[1]),
                "vi"
            )
        )
        .forEach(([maKyThi, tenKyThi]) => {

            const option =
                document.createElement("option");

            option.value = maKyThi;
            option.textContent = tenKyThi;

            examSelect.appendChild(option);

        });

    if (
        [...examSelect.options]
            .some(o => o.value === current)
    ) {
        examSelect.value = current;
    }

}


/*
 * Tính xếp hạng.
 *
 * Mỗi maKyThi là một bảng xếp hạng độc lập.
 *
 * Tiêu chí:
 * 1. Điểm cao hơn
 * 2. Rời tab ít hơn
 * 3. Thời gian hoàn thành ngắn hơn
 */
function createRanking(data) {

    const groups = {};

    data.forEach(item => {

        const key =
            item.maKyThi || item.tenKyThi;

        if (!key) return;

        if (!groups[key]) {
            groups[key] = [];
        }

        groups[key].push(item);

    });

    Object.keys(groups).forEach(key => {

        groups[key].sort((a, b) => {

            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }

            if (a.roiTab !== b.roiTab) {
                return a.roiTab - b.roiTab;
            }

            return parseTG(a.thoiGian) -
                   parseTG(b.thoiGian);

        });

        /*
         * Cùng một mã HS trong cùng kỳ thi chỉ lấy
         * kết quả đầu tiên/duy nhất.
         */
        const unique = [];
        const seen = new Set();

        groups[key].forEach(item => {

            if (!seen.has(item.maHS)) {

                seen.add(item.maHS);
                unique.push(item);

            }

        });

        groups[key] = unique;

    });

    return groups;

}


/*
 * Hiển thị bảng.
 */
function renderRanking() {

    const namHoc =
        namHocSelect.value;

    const dotThi =
        dotThiSelect.value;

    const maKyThi =
        examSelect.value;

    let data =
        allResults.filter(item => {

            const okNam =
                namHoc === "ALL" ||
                item.namHoc === namHoc;

            const okDot =
                dotThi === "ALL" ||
                item.dotThi === dotThi;

            const okExam =
                maKyThi === "ALL" ||
                item.maKyThi === maKyThi;

            return okNam && okDot && okExam;

        });

    const groups =
        createRanking(data);

    /*
     * Khi chọn một kỳ thi cụ thể:
     * hiển thị đúng một bảng xếp hạng.
     *
     * Khi chọn ALL:
     * hiển thị kết quả của tất cả kỳ thi,
     * nhưng hạng luôn tính riêng theo từng maKyThi.
     */
    const rowsToShow = [];

    if (maKyThi !== "ALL") {

        const group =
            groups[maKyThi] || [];

        group.forEach((item, index) => {

            rowsToShow.push({
                item,
                hang: index + 1,
                tong: group.length
            });

        });

    }
    else {

        Object.keys(groups).forEach(key => {

            groups[key].forEach((item, index) => {

                rowsToShow.push({
                    item,
                    hang: index + 1,
                    tong: groups[key].length
                });

            });

        });

    }

    rankingBody.innerHTML = "";

    if (!rowsToShow.length) {

        rankingBody.innerHTML = `
            <tr>
                <td colspan="9">
                    Chưa có dữ liệu phù hợp.
                </td>
            </tr>
        `;

        tongThiSinh.textContent =
            "Tổng số thí sinh: 0";

        return;

    }

    /*
     * Khi ALL: sắp xếp theo tên kỳ thi rồi đến hạng.
     * Khi một kỳ thi: giữ thứ tự xếp hạng.
     */
    if (maKyThi === "ALL") {

        rowsToShow.sort((a, b) => {

            const examCompare =
                String(
                    a.item.tenKyThi
                ).localeCompare(
                    String(b.item.tenKyThi),
                    "vi"
                );

            if (examCompare !== 0) {
                return examCompare;
            }

            return a.hang - b.hang;

        });

    }

    rowsToShow.forEach(row => {

        const item = row.item;

        const tr =
            document.createElement("tr");

        if (row.hang === 1) {
            tr.classList.add("hang1");
        }
        else if (row.hang === 2) {
            tr.classList.add("hang2");
        }
        else if (row.hang === 3) {
            tr.classList.add("hang3");
        }

        tr.innerHTML = `

            <td>
                ${row.hang}
            </td>

            <td>
                ${escapeHTML(item.maHS)}
            </td>

            <td>
                ${escapeHTML(item.hoTen)}
            </td>

            <td>
                ${escapeHTML(item.lop)}
            </td>

            <td>
                ${escapeHTML(item.dotThi)}
            </td>

            <td>
                ${escapeHTML(item.tenKyThi)}
            </td>

            <td>
                ${item.diem}
            </td>

            <td>
                ${item.roiTab}
            </td>

            <td>
                ${escapeHTML(item.thoiGian)}
            </td>

        `;

        rankingBody.appendChild(tr);

    });

    /*
     * Khi ALL, đây là tổng số dòng kết quả sau lọc.
     * Khi một kỳ thi, đây chính là số thí sinh của kỳ thi.
     */
    tongThiSinh.textContent =
        "Tổng số thí sinh: " +
        rowsToShow.length;

}


/*
 * Tải toàn bộ KETQUA.
 */
async function loadKETQUA() {

    if (
        !KETQUA_CSV_URL ||
        KETQUA_CSV_URL ===
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRULO6RaaXqNERaYMuLx9cpHLp3hxqL3i2PHuccrdbSvFaQgpsrPvRk-fhgzlOxamLUYCe1sLQMQvPL/pub?output=csv"
    ) {

        rankingBody.innerHTML = `
            <tr>
                <td colspan="9">
                    Chưa cấu hình URL CSV của Sheet KETQUA.
                </td>
            </tr>
        `;

        return;

    }

    try {

        const response =
            await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRULO6RaaXqNERaYMuLx9cpHLp3hxqL3i2PHuccrdbSvFaQgpsrPvRk-fhgzlOxamLUYCe1sLQMQvPL/pub?output=csv");

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        allResults =
            convertRows(parseCSV(text));

        /*
         * Danh sách năm học và đợt thi.
         */
        fillSelect(
            namHocSelect,
            new Set(
                allResults.map(
                    item => item.namHoc
                )
            )
        );

        fillSelect(
            dotThiSelect,
            new Set(
                allResults.map(
                    item => item.dotThi
                )
            )
        );

        updateExamFilter();
        renderRanking();

    }
    catch (error) {

        console.error(
            "Lỗi tải KETQUA:",
            error
        );

        rankingBody.innerHTML = `
            <tr>
                <td colspan="9">
                    Không thể tải dữ liệu KETQUA.
                    Vui lòng kiểm tra URL CSV.
                </td>
            </tr>
        `;

    }

}


/*
 * Bộ lọc.
 */
namHocSelect.addEventListener(
    "change",
    function() {

        updateExamFilter();
        renderRanking();

    }
);

dotThiSelect.addEventListener(
    "change",
    function() {

        updateExamFilter();
        renderRanking();

    }
);

examSelect.addEventListener(
    "change",
    function() {

        renderRanking();

    }
);

loadKETQUA();

</script>
