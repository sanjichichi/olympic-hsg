<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi chính thức</title>
    <link
rel="stylesheet"
href="css/style-old.css">
  <link rel="stylesheet" href="css/responsive.css">


<style>
/* =========================================================
   GIAO DIỆN CUỘN V2
   - Thông tin thí sinh + lớp + thời gian + tiến độ: STICKY
   - Thanh "Câu hỏi": STICKY ở cột bên phải
   - Không fixed từng thanh riêng lẻ nên không bị mất/đè khi cuộn
========================================================= */

html,
body {
    overflow-x: hidden !important;
}

/* Cho sticky hoạt động theo viewport */
.exam-layout {
    overflow: visible !important;
    align-items: flex-start !important;
}

.exam-container {
    overflow: visible !important;
    min-width: 0;
}

/* =========================
   KHỐI ĐẦU TRANG BÀI THI
========================= */
.exam-header {
    position: sticky !important;
    top: 0 !important;
    z-index: 9000 !important;

    background: #ffffff !important;
    padding-top: 8px !important;
    padding-bottom: 10px !important;

    /* tạo nền kín để nội dung phía dưới không xuyên qua */
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

/* Tiêu đề */
.exam-header h2 {
    margin-top: 4px !important;
    margin-bottom: 12px !important;
}

/* =========================
   THÔNG TIN THÍ SINH
========================= */
.exam-header .info-box {
    display: grid !important;
    grid-template-columns: minmax(0, 1.8fr) minmax(120px, 1fr) minmax(90px, .65fr) minmax(130px, .85fr) !important;
    align-items: center !important;
    gap: 8px 16px !important;

    width: 100% !important;
    min-height: 42px !important;
    box-sizing: border-box !important;

    padding: 9px 14px !important;
    margin: 0 0 9px 0 !important;

    background: #f8fbff !important;
    border: 1px solid #d9e5f5 !important;
    border-radius: 10px !important;

    color: #222 !important;
    visibility: visible !important;
    opacity: 1 !important;
}

/* Bốn trường thông tin không chồng lên nhau */
.exam-header .info-box > div {
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    min-width: 0 !important;
    white-space: nowrap !important;
    overflow: hidden !important;
}

.exam-header .info-box > div span {
    min-width: 0 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
}

.exam-header .info-box strong {
    color: #125eb8 !important;
    flex: 0 0 auto !important;
}

.exam-header .info-box span {
    color: #222 !important;
}

/* =========================
   THỜI GIAN
========================= */
#timer {
    font-weight: 800 !important;
    color: #e0ad00 !important;
    font-size: 22px !important;
}

/* =========================
   THANH TIẾN ĐỘ
========================= */
.exam-header .progress-box {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;

    width: 100% !important;
    box-sizing: border-box !important;

    min-height: 38px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    margin: 0 !important;
    padding: 7px 12px !important;

    background: #fff4c7 !important;
    border: 1px solid #eadb9b !important;
    border-radius: 9px !important;
    box-shadow: 0 2px 6px rgba(0,0,0,.08) !important;

    color: #111 !important;
    font-weight: 700 !important;
    z-index: auto !important;
}

/* =========================
   CỘT CÂU HỎI BÊN PHẢI
========================= */
.question-nav {
    position: sticky !important;
    top: 10px !important;
    z-index: 8000 !important;

    align-self: flex-start !important;

    max-height: calc(100vh - 20px) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;

    box-sizing: border-box !important;
}

/* Khi nhảy đến câu hỏi */
.question,
.qe-question,
[id^="question-"],
[id^="cau-"] {
    scroll-margin-top: 210px !important;
}

/* =========================
   MÁY TÍNH BẢNG / MÀN HÌNH NHỎ
========================= */
@media (max-width: 1000px) {
    .exam-header .info-box {
        grid-template-columns: 1fr 1fr !important;
    }

    .exam-header .info-box > div:first-child {
        grid-column: 1 / -1 !important;
    }

    .question-nav {
        top: 6px !important;
    }
}

/* =========================
   ĐIỆN THOẠI
   Header vẫn sticky; thanh câu hỏi
   không ép thành cột cố định nếu layout
   của responsive chuyển thành một cột.
========================= */
@media (max-width: 768px) {
    .exam-header {
        top: 0 !important;
        padding: 6px 0 8px !important;
    }

    .exam-header h2 {
        margin: 3px 0 8px !important;
        font-size: 20px !important;
        line-height: 1.25 !important;
    }

    .exam-header .info-box {
        grid-template-columns: 1fr 1fr !important;
        gap: 6px 10px !important;
        padding: 8px 10px !important;
    }

    .exam-header .info-box > div {
        white-space: normal !important;
    }

    #timer {
        font-size: 19px !important;
    }

    .exam-header .progress-box {
        min-height: 34px !important;
        padding: 6px 8px !important;
        font-size: 13px !important;
    }

    .question,
    .qe-question,
    [id^="question-"],
    [id^="cau-"] {
        scroll-margin-top: 185px !important;
    }

    .question-nav {
        position: sticky !important;
        top: 0 !important;
        max-height: 45vh !important;
    }
}
</style>

<body>

<div class="exam-layout">

    <div class="exam-container">

    <div class="exam-header">

        <h2>ÔN TẬP CỦNG CỐ-NÂNG CAO-ĐÁNH GIÁ NĂNG LỰC</h2>

        <div class="info-box">
            <div>
                <strong>Thí sinh:</strong>
                <span id="tenThiSinh"></span>
            </div>
            <div>
                <strong>Ngày sinh:</strong>
                <span id="ngaySinh"></span>
            </div>
            <div>
                <strong>Lớp:</strong>
                <span id="lopThiSinh"></span>
            </div>
            <div>
                <strong>Thời gian:</strong>
                <span id="timer"></span>
            </div>
        </div>
        <div class="progress-box">
            Đã hoàn thành:
             <span id="soCauDaLam">0</span>/<span id="tongSoCau">0</span> câu
        </div>

    </div>

    <div id="khuVucCauHoi">
    </div>
    <button
    class="submit-btn"
    onclick="nopBai()">

    NỘP BÀI

    </button>
    </div>

<div class="question-nav">

    <h3>Câu hỏi</h3>

    <div id="questionNavContainer">
    </div>

</div>


<script>
/*
=========================================================
THI.HTML – NẠP NGÂN HÀNG CÂU HỎI CẤU TRÚC MỚI
=========================================================

Cấu trúc mới:
  type
  question
  options[]
  correctValues[]

Không dùng <script src="fileDe"> nữa.
Dùng fetch() để:
  1. kiểm tra HTTP 404
  2. đọc file JS
  3. chuyển cấu trúc mới -> cấu trúc mà js/thi.js đang dùng

Có fallback cho trường hợp fileDe cũ vẫn còn là:
  nganhang/van/de-van.js
=========================================================
*/

const fileDe = localStorage.getItem("fileDe");

/*
 * PHIÊN MỚI:
 * - Khi đi từ trang xác nhận sang trang thi (navigation mới),
 *   xóa phiên thi cũ để tiến độ bắt đầu đúng 0.
 * - Khi F5/reload, giữ phiên để khôi phục bài đang làm.
 */
(function () {
    try {
        const nav = performance.getEntriesByType("navigation")[0];
        const navType = nav ? nav.type : "navigate";

        if (navType !== "reload") {
            const sessionKey =
                "baiThiDangLam_v2_" +
                String(localStorage.getItem("maThiSinh") || "unknown") +
                "_" +
                String(
                    localStorage.getItem("fileDe") ||
                    localStorage.getItem("tenKyThi") ||
                    "de"
                );

            localStorage.removeItem(sessionKey);
            console.log("🆕 Bắt đầu phiên thi mới:", sessionKey);
        }
    } catch (e) {
        console.warn("Không xác định được loại điều hướng:", e);
    }
})();


console.log("📚 fileDe =", fileDe);
console.log("📚 tên kỳ thi =", localStorage.getItem("tenKyThi"));


/* =====================================================
   1. CHUYỂN CẤU TRÚC NGÂN HÀNG MỚI
===================================================== */

function chuyenNganHangMoiSangCu(bank) {

    let list = [];

    if (Array.isArray(bank)) {

        list = bank;

    }
    else if (
        bank &&
        Array.isArray(bank.cauHoi)
    ) {

        list = bank.cauHoi;

    }
    else if (
        bank &&
        Array.isArray(bank.questions)
    ) {

        list = bank.questions;

    }

    return list.map(function(q) {

        const type = String(
            q.type ||
            q.loai ||
            "single_select"
        )
        .trim()
        .toLowerCase();


        const options =
            Array.isArray(q.options)
                ? q.options
                : [];


        const correctValues =
            Array.isArray(q.correctValues)
                ? q.correctValues
                : (
                    q.correctValue != null
                        ? [q.correctValue]
                        : []
                );


        const base = {

            id:
                q.id ||
                q.maCau ||
                "",

            cauHoi:
                q.question ||
                q.cauHoi ||
                "",

            question:
                q.question ||
                q.cauHoi ||
                "",

            hint:
                q.hint ||
                "",

            chuDe:
                q.chuDe ||
                "",

            mucDo:
                q.mucDo ||
                q.mucDoPhanHoa ||
                "",

            mucDoPhanHoa:
                q.mucDoPhanHoa ||
                q.mucDo ||
                "",

            mon:
                q.mon ||
                "",

            phamVi:
                q.phamVi ||
                "",

            dinhHuong:
                q.dinhHuong ||
                "",

            diem:
                Number(q.diem || 1)

        };


        /* =========================
           SINGLE SELECT
        ========================= */

        if (
            type === "single_select" ||
            type === "single-select" ||
            type === "mcq"
        ) {

            const result = {

                ...base,

                loai:
                    "MCQ",

                type:
                    "MCQ"

            };


            options.forEach(function(opt) {

                const value =
                    String(
                        opt.value ?? ""
                    );

                if (value) {

                    result[value] =
                        opt.label ?? "";

                }

            });


            result.dapAn =
                correctValues.length
                    ? String(
                        correctValues[0]
                    )
                    : "";


            return result;

        }


        /* =========================
           TRUE / FALSE
        ========================= */

        if (
            type === "true_false" ||
            type === "truefalse" ||
            type === "true-false"
        ) {

            const result = {

                ...base,

                loai:
                    "TRUEFALSE",

                type:
                    "TRUEFALSE"

            };


            /*
             * Cấu trúc mới có thể lưu:
             * true / false
             * hoặc A / B.
             */

            const answer =
                String(
                    correctValues[0] ?? ""
                )
                .trim()
                .toLowerCase();


            if (
                answer === "true" ||
                answer === "d" ||
                answer === "a"
            ) {

                result.dapAn = "D";

            }
            else {

                result.dapAn = "S";

            }


            return result;

        }


        /* =========================
           MULTI SELECT
        ========================= */

        if (
            type === "multi_select" ||
            type === "multi-select" ||
            type === "multi"
        ) {

            const result = {

                ...base,

                loai:
                    "MULTI",

                type:
                    "MULTI",

                dapAn:
                    correctValues.map(
                        String
                    )

            };


            options.forEach(function(opt) {

                const value =
                    String(
                        opt.value ?? ""
                    );

                if (value) {

                    result[value] =
                        opt.label ?? "";

                }

            });


            return result;

        }


        /* =========================
           FILL BLANK
        ========================= */

        if (
            type === "fill_blank" ||
            type === "fill" ||
            type === "fill_blank_text"
        ) {

            return {

                ...base,

                loai:
                    "FILL",

                type:
                    "FILL",

                dapAn:
                    correctValues.map(
                        String
                    ),

                placeholder:
                    q.placeholder ||
                    "Nhập câu trả lời..."

            };

        }


        /* =========================
           MATCHING
        ========================= */

        if (
            type === "matching" ||
            type === "match"
        ) {

            return {

                ...base,

                loai:
                    "MATCH",

                type:
                    "MATCH",

                cotA:
                    q.cotA ||
                    q.left ||
                    q.columnA ||
                    [],

                cotB:
                    q.cotB ||
                    q.right ||
                    q.columnB ||
                    [],

                dapAn:
                    q.dapAn ||
                    q.correctMatches ||
                    q.correctValues ||
                    {}

            };

        }


        /* =========================
           ORDERING
        ========================= */

        if (
            type === "ordering" ||
            type === "order" ||
            type === "sort"
        ) {

            return {

                ...base,

                loai:
                    "SORT",

                type:
                    "SORT",

                items:
                    q.items ||
                    q.options ||
                    [],

                dapAn:
                    q.dapAn ||
                    q.correctOrder ||
                    q.correctValues ||
                    []

            };

        }


        /* =========================
           FALLBACK
        ========================= */

        const fallback = {

            ...base,

            loai:
                "MCQ",

            type:
                "MCQ",

            dapAn:
                correctValues.length
                    ? String(
                        correctValues[0]
                    )
                    : ""

        };


        options.forEach(function(opt) {

            const value =
                String(
                    opt.value ?? ""
                );

            if (value) {

                fallback[value] =
                    opt.label ?? "";

            }

        });


        return fallback;

    });

}


/* =====================================================
   2. TẠO DANH SÁCH ĐƯỜNG DẪN DỰ PHÒNG
===================================================== */

function taoDanhSachDuongDan() {

    const ds = [];


    function them(path) {

        if (
            path &&
            !ds.includes(path)
        ) {

            ds.push(path);

        }

    }


    /*
     * Ưu tiên chính xác fileDe đã lưu.
     */

    them(fileDe);


    /*
     * Nếu fileDe cũ là de-van.js,
     * thử các file ngân hàng Văn 9 mới.
     */

    if (
        fileDe &&
        /de-van\.js$/i.test(fileDe)
    ) {

        const base =
            fileDe
                .replace(
                    /de-van\.js$/i,
                    ""
                );


        them(
            base +
            "van-9.js"
        );


        them(
            base +
            "van-phan-hoa-9.js"
        );


        them(
            base +
            "van-9-phan-hoa-chuan-hoa.js"
        );

    }


    /*
     * Nếu fileDe không có đường dẫn,
     * thử vị trí chuẩn của ngân hàng.
     */

    if (
        !fileDe ||
        fileDe.trim() === ""
    ) {

        them(
            "nganhang/van/9/van-9.js"
        );

        them(
            "nganhang/van/9/van-phan-hoa-9.js"
        );

    }


    return ds;

}


/* =====================================================
   3. TẢI NGÂN HÀNG BẰNG FETCH
===================================================== */

async function taiNganHang() {

    const danhSach =
        taoDanhSachDuongDan();


    if (!danhSach.length) {

        throw new Error(
            "Chưa có đường dẫn file đề."
        );

    }


    let loiCuoi =
        null;


    for (
        const path
        of danhSach
    ) {

        try {

            console.log(
                "📥 Đang thử tải:",
                path
            );


            const response =
                await fetch(
                    path +
                    "?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const code =
                await response.text();


            /*
             * Chạy file ngân hàng trong
             * scope riêng và lấy nganHangDe.
             */

            const fn =
                new Function(
                    code +
                    `

                    return (
                        typeof nganHangDe !==
                        "undefined"

                    )

                    ? nganHangDe

                    : (

                        typeof cauHoi !==
                        "undefined"

                        ? {
                            cauHoi:
                                cauHoi
                          }

                        : null

                    );

                    `
                );


            const data =
                fn();


            if (!data) {

                throw new Error(
                    "File không tạo ra nganHangDe/cauHoi."
                );

            }


            const cauHoiMoi =
                chuyenNganHangMoiSangCu(
                    data
                );


            if (
                !Array.isArray(
                    cauHoiMoi
                ) ||
                cauHoiMoi.length === 0
            ) {

                throw new Error(
                    "Ngân hàng không có câu hỏi."
                );

            }


            /*
             * Quan trọng:
             * js/thi.js đang đọc biến cauHoi.
             */

            window.cauHoi =
                cauHoiMoi;


            console.log(
                "✅ Đã tải ngân hàng:",
                path
            );

            console.log(
                "📊 Số câu:",
                cauHoiMoi.length
            );


            return path;

        }
        catch(error) {

            console.warn(
                "⚠️ Không tải được:",
                path,
                error
            );


            loiCuoi =
                error;

        }

    }


    throw new Error(
        "Không tải được ngân hàng câu hỏi.\n" +
        "File đang lưu: " +
        (fileDe || "(trống)") +
        "\n" +
        "Lỗi cuối: " +
        (
            loiCuoi
                ? loiCuoi.message
                : "không xác định"
        )
    );

}


/* =====================================================
   4. KHỞI ĐỘNG
===================================================== */

async function khoiDongTrangThi() {

    try {

        if (!fileDe) {

            throw new Error(
                "Không tìm thấy localStorage.fileDe"
            );

        }


        await taiNganHang();


        /*
         * Chỉ sau khi ngân hàng tải thành công
         * mới chạy Question Engine.
         */

        const scriptThi =
            document.createElement(
                "script"
            );


        scriptThi.src =
            "js/thi.js";


        scriptThi.onload =
            function() {

                console.log(
                    "✅ Đã tải js/thi.js"
                );

            };


        scriptThi.onerror =
            function() {

                alert(
                    "❌ Không tìm thấy js/thi.js"
                );

            };


        document.body.appendChild(
            scriptThi
        );

    }
    catch(error) {

        console.error(
            "❌ Lỗi tải đề:",
            error
        );


        alert(
            "❌ Không tải được ngân hàng câu hỏi.\n\n" +
            error.message +
            "\n\n" +
            "Hãy kiểm tra lại đường dẫn fileDe trong cấu hình kỳ thi."
        );

    }

}


khoiDongTrangThi();

</script>
