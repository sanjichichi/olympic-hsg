<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng học tập</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#263238}
.hero{background:linear-gradient(135deg,#173b8f,#2563eb);color:#fff;padding:28px 5%}
.box{max-width:1100px;margin:25px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 5px 20px #0001}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.task{padding:18px;border:1px solid #e2e8f0;border-radius:14px}
.task button{background:#2563eb;color:white;border:0;padding:9px 14px;border-radius:8px;cursor:pointer}
.status{padding:12px;background:#f8fafc;border-radius:12px;margin:12px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero">
<h1>🎯 Lộ trình học tập</h1>
<p id="u">Đang xác định học sinh...</p>
</header>

<main class="box">
<h2 id="r">Đang xác định phòng...</h2>
<p>Phòng học được lấy từ kết quả phân hóa sau kỳ thi.</p>
<div id="status" class="status">Đang tải dữ liệu...</div>
<div class="grid" id="tasks"></div>
</main>

<script>
"use strict";

const CSV_URL_PHAN_HOA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRULO6RaaXqNERaYMuLx9cpHLp3hxqL3i2PHuccrdbSvFaQgpsrPvRk-fhgzlOxamLUYCe1sLQMQvPL/pub?gid=2125905868&single=true&output=csv";

function clean(v){return String(v??"").trim()}

function readJSON(key){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
}

function user(){
  for(const k of[
    "maHS","MaHS","studentCode","maHocSinh",
    "studentId","StudentId"
  ]){
    const v=localStorage.getItem(k);
    if(v&&clean(v))return clean(v);
  }

  for(const k of[
    "user","currentUser","taiKhoanHS","hocSinh",
    "taiKhoan","currentStudent","student"
  ]){
    const o=readJSON(k);
    const v=o?.maHS||o?.MaHS||o?.studentCode||o?.maHocSinh||
            o?.studentId||o?.StudentId;
    if(v)return clean(v);
  }

  return "";
}

function csvLine(s){
  let a=[],v="",q=false;
  for(let i=0;i<s.length;i++){
    let c=s[i];
    if(c=='"'){
      if(q&&s[i+1]=='"'){v+='"';i++}
      else q=!q;
    }else if(c==","&&!q){a.push(v.trim());v=""}
    else v+=c;
  }
  a.push(v.trim());
  return a;
}

function parseCSV(t){
  const l=t.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());
  if(!l.length)return[];
  const h=csvLine(l[0]);
  return l.slice(1).map(x=>{
    const v=csvLine(x),o={};
    h.forEach((k,i)=>o[k]=v[i]??"");
    return o;
  });
}

function val(o,ks){
  if(!o)return"";
  for(const k of ks){
    if(o[k]!=null&&clean(o[k]))return clean(o[k]);
  }
  return"";
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function getRoom(x){
  return val(x,[
    "phongHoc","phong","PhongHoc","Phòng học","room","Room"
  ])||"P01 - Củng cố";
}

function getLevel(room){
  const r=clean(room).toUpperCase();
  if(r.includes("P04"))return"P04";
  if(r.includes("P03"))return"P03";
  if(r.includes("P02"))return"P02";
  return"P01";
}

function getMon(x){
  return val(x,[
    "mon","Mon","Môn","monThi","MonThi","Môn thi",
    "tenMon","TenMon","Tên môn","subject","Subject"
  ]);
}

function getKhoi(x){
  let k=val(x,[
    "khoi","Khoi","Khối","khoiLop","KhoiLop","Khối lớp",
    "grade","Grade"
  ]);

  let m=k.match(/\d+/);
  if(m)return m[0];

  const lop=val(x,[
    "lop","Lop","Lớp","tenLop","TenLop","Tên lớp","class","Class"
  ]);

  m=lop.match(/\d+/);
  return m?m[0]:"";
}

function getMaKyThi(x){
  return val(x,[
    "maKyThi","MaKyThi","Mã kỳ thi","kyThiId","examId"
  ]);
}

function getTenKyThi(x){
  return val(x,[
    "tenKyThi","TenKyThi","Tên kỳ thi","kyThi","examName"
  ]);
}

let u=user(),current=null;

async function load(){

  document.getElementById("u").textContent=
    "Mã học sinh: "+(u||"chưa xác định");

  if(!u){
    document.getElementById("r").textContent=
      "⚠️ Chưa xác định được mã học sinh";
    document.getElementById("status").textContent=
      "Hãy đăng nhập lại trước khi vào phòng học.";
    return;
  }

  try{

    document.getElementById("status").textContent=
      "🔄 Đang tải dữ liệu phân hóa...";

    const res=await fetch(
      CSV_URL_PHAN_HOA+"&t="+Date.now(),
      {cache:"no-store"}
    );

    if(!res.ok)
      throw new Error("Không tải được dữ liệu PHAN_HOA.");

    const rows=parseCSV(await res.text());

    const list=rows.filter(r=>
      val(r,[
        "maHS","MaHS","Mã học sinh","studentCode",
        "maHocSinh","studentId"
      ])===u
    );

    if(!list.length){
      document.getElementById("r").textContent=
        "⚠️ Chưa có kết quả phân hóa";
      document.getElementById("status").textContent=
        "Không tìm thấy mã "+u+" trong dữ liệu PHAN_HOA.";
      return;
    }

    list.sort((a,b)=>
      String(b.thoiGianPhanHoa||"").localeCompare(
        String(a.thoiGianPhanHoa||"")
      )
    );

    current=list[0];

    const room=getRoom(current);
    const level=getLevel(room);

    document.getElementById("u").innerHTML=
      "Mã học sinh: <b>"+esc(u)+"</b> · "+
      esc(val(current,["hoTen","HoTen","Họ tên"]))+
      " · Lớp "+
      esc(val(current,["lop","Lop","Lớp"]));

    document.getElementById("r").innerHTML=
      "🎯 "+esc(room)+
      " <small>— "+esc(val(current,["mucDo","MucDo"]))+"</small>";

    document.getElementById("status").innerHTML=
      "✅ Đã xác định mức luyện tập: <b>"+esc(level)+
      "</b> · "+esc(level==="P01"?"Cơ bản":
                      level==="P02"?"Thông hiểu":
                      level==="P03"?"Khá / Vận dụng":
                      "Nâng cao / HSG");

    document.getElementById("tasks").innerHTML=[
      ["📘","Ôn kiến thức nền","Luyện tập theo mức "+level],
      ["📝","Bài luyện tập","10 câu được chọn từ ngân hàng theo "+level],
      ["🎯","Kiểm tra nhanh","Đánh giá lại sau khi hoàn thành bài luyện tập"]
    ].map(x=>`
      <article class="task">
        <h3>${x[0]} ${x[1]}</h3>
        <p>${x[2]}</p>
        <button onclick="vaoLuyenTap()">Bắt đầu</button>
      </article>
    `).join("");

  }catch(e){

    console.error("❌ LỖI PHÒNG HỌC:",e);

    document.getElementById("r").textContent=
      "⚠️ Không tải được dữ liệu phân hóa";

    document.getElementById("status").textContent=
      e.message;
  }
}

function vaoLuyenTap(){

  if(!current){
    alert("Chưa có dữ liệu học tập của học sinh.");
    return;
  }

  const context={
    maHS:u,
    maKyThi:getMaKyThi(current),
    tenKyThi:getTenKyThi(current),
    mon:getMon(current),
    khoi:getKhoi(current),
    lop:val(current,["lop","Lop","Lớp"]),
    phongHoc:getRoom(current),
    mucDo:val(current,["mucDo","MucDo"])
  };

  localStorage.setItem(
    "phongHocCurrent",
    JSON.stringify(current)
  );

  localStorage.setItem(
    "phongHocContext",
    JSON.stringify(context)
  );

  localStorage.setItem(
    "phongHocLevel",
    getLevel(getRoom(current))
  );

  console.log("📚 Context phòng học:",context);

  location.href="bai-luyen-tap-phan-hoa.html";
}

document.addEventListener("DOMContentLoaded",load);
</script>
</body>
</html>
