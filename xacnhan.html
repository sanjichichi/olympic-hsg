
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Xác nhận thông tin thí sinh</title>

<link
rel="stylesheet"
href="css/style-old.css">

  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div class="login-page">

    <div class="login-container">

        <h1>XÁC NHẬN THÔNG TIN</h1>

        <p>
            <strong>Họ và tên:</strong>
            <span id="hoTen"></span>
        </p>

        <p>
            <strong>Lớp:</strong>
            <span id="lop"></span>
        </p>

        <p>
            <strong>Ngày sinh:</strong>
            <span id="ngaySinh"></span>
        </p>

        <p>
            <strong>Kỳ thi:</strong>
            <span id="kyThi"></span>
        </p>

        <p>
            <strong>Thời gian làm bài:</strong>
            <span id="thoiGian"></span> phút
        </p>

        <p>
            <strong>Số câu hỏi:</strong>
            <span id="soCau"></span> câu
        </p>

        <label style="display:block;margin:20px 0;">

            <input
            type="checkbox"
            id="camKet">

            Tôi đã kiểm tra đúng thông tin cá nhân
            và cam kết thực hiện đúng quy chế thi.

        </label>

        <button onclick="batDauThi()">

            🚀 BẮT ĐẦU THI

        </button>

    </div>

</div>

<script>
// Kiểm tra đăng nhập
if(
!localStorage.getItem(
"tenThiSinh"
)
){

    alert(
    "Vui lòng đăng nhập!"
    );

    window.location.href =
    "login.html";
}
// Hiển thị thông tin thí sinh
document.getElementById("hoTen").innerHTML = localStorage.getItem("tenThiSinh");
document.getElementById("lop").innerHTML = localStorage.getItem("lopThiSinh");
document.getElementById("ngaySinh").innerHTML = localStorage.getItem("ngaySinh");
document.getElementById("kyThi").innerHTML = localStorage.getItem("tenKyThi");
console.log("tenKyThi =", localStorage.getItem("tenKyThi"));
// Chọn kỳ thi
if (!localStorage.getItem("fileDe")) {

    alert("Vui lòng chọn kỳ thi!");

    window.location.href = "chonkithi.html";

}
// Hiển thị thời gian, số câu hỏi
document.getElementById("thoiGian").innerHTML = localStorage.getItem("thoiGian");
document.getElementById("soCau").innerHTML = localStorage.getItem("soCau");
function batDauThi() {

    const camKet = document.getElementById("camKet");

    // Chưa xác nhận cam kết
    if (!camKet || !camKet.checked) {

        alert("Vui lòng xác nhận cam kết!");

        return;
    }

    // ==========================================
    // 1. XÓA PHIÊN THI CŨ
    // ==========================================

    const sessionKey =
        "baiThiDangLam_v2_" +
        String(
            localStorage.getItem("maThiSinh") ||
            "unknown"
        ) +
        "_" +
        String(
            localStorage.getItem("fileDe") ||
            localStorage.getItem("tenKyThi") ||
            "de"
        );

    localStorage.removeItem(sessionKey);


    // ==========================================
    // 2. ĐÁNH DẤU BẮT ĐẦU PHIÊN THI MỚI
    // ==========================================

    localStorage.setItem(
        "phienThiMoi",
        "1"
    );


    // ==========================================
    // 3. MỞ TOÀN MÀN HÌNH
    // ==========================================

    try {

        if (
            document.documentElement.requestFullscreen
        ) {

            const p =
                document.documentElement
                    .requestFullscreen();

            if (
                p &&
                typeof p.catch === "function"
            ) {

                p.catch(function () {
                    console.warn(
                        "Không thể mở toàn màn hình."
                    );
                });

            }

        }

    } catch (e) {

        console.warn(
            "Fullscreen không khả dụng:",
            e
        );

    }


    // ==========================================
    // 4. VÀO TRANG THI
    // ==========================================

    window.location.href =
        "thi.html";
}

</script>

</body>

</html>
