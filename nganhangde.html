<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ngân hàng câu hỏi - Olympic HSG Online</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:20px 30px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:5px 0 0;
    opacity:.9;
}

/* ================= CONTAINER ================= */

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

/* ================= TOOLBAR ================= */

.toolbar{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.toolbar-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

select,
input,
textarea{
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:10px 12px;
    font-size:14px;
    outline:none;
    background:white;
}

select:focus,
input:focus,
textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.search{
    flex:1;
    min-width:220px;
}

button{
    border:none;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#e5e7eb;
    color:#374151;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat-title{
    color:#6b7280;
    font-size:13px;
}

.stat-value{
    font-size:27px;
    font-weight:700;
    margin-top:5px;
}

/* ================= TABLE ================= */

.table-wrap{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f8fafc;
}

th,
td{
    padding:13px 12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:14px;
}

th{
    color:#475569;
    font-size:13px;
}

tbody tr:hover{
    background:#f8fbff;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    background:#eef2ff;
    color:#4338ca;
    font-size:12px;
    font-weight:600;
}

.badge-green{
    background:#dcfce7;
    color:#166534;
}

.badge-orange{
    background:#fef3c7;
    color:#92400e;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:60px 20px;
    color:#6b7280;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.modal-box{
    background:white;
    width:100%;
    max-width:850px;
    margin:30px auto;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
    overflow:hidden;
}

.modal-header{
    padding:18px 22px;
    background:#f8fafc;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.modal-body{
    padding:22px;
}

.modal-footer{
    padding:15px 22px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
}

.option-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option-item{
    display:flex;
    gap:8px;
    align-items:center;
}

.option-item span{
    width:30px;
    height:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#eef2ff;
    color:#4338ca;
    font-weight:700;
}

.option-item input{
    flex:1;
}

.preview-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    line-height:1.7;
}

.preview-option{
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:10px;
    margin-top:8px;
}

.preview-answer{
    margin-top:15px;
    background:#ecfdf5;
    color:#166534;
    padding:10px;
    border-radius:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .option-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5){
        display:none;
    }

}

<script>
/* =====================================================
   NGÂN HÀNG CÂU HỎI – CẤU TRÚC MỚI
   Chuẩn:
   {
     id, type, question, options, correctValues,
     hint, mucDo, mucDoPhanHoa, chuDe, mon, phamVi, diem,
     image
   }
===================================================== */

let nganHang = {
    thongTin: {
        mon: "",
        khoi: "",
        ten: "",
        phienBan: "2.0"
    },
    cauHoi: []
};

let selectedIds = new Set();
let editingIndex = -1;

const TYPE_NAMES = {
    MCQ: "Trắc nghiệm 1 đáp án",
    MULTI: "Nhiều đáp án",
    TRUEFALSE: "Đúng / Sai",
    FILL: "Điền từ",
    MATCH: "Ghép nối",
    SORT: "Sắp xếp",
    SHORT: "Trả lời ngắn",
    IMAGE: "Hình ảnh",
    READING: "Đọc hiểu",
    AUDIO: "Âm thanh"
};

function changeSubject(){ loadQuestionBank(); }
function changeGrade(){ loadQuestionBank(); }

function getBankSubject(mon){
    return mon === "tienganh" ? "anh" : mon;
}

function getBankPath(){
    const mon = document.getElementById("selectMon").value;
    const khoi = document.getElementById("selectKhoi").value;
    if(!mon || !khoi) return null;

    const bankMon = getBankSubject(mon);

    // Cấu trúc mới của dự án:
    // nganhang/mon/mon-khoi.js
    return `nganhang/${bankMon}/${bankMon}-${khoi}.js`;
}

function normalizeType(type){
    const t = String(type || "single_select").trim().toLowerCase();

    if(["single_select","single-select","mcq"].includes(t)) return "MCQ";
    if(["multi_select","multi-select","multi"].includes(t)) return "MULTI";
    if(["true_false","truefalse","true-false"].includes(t)) return "TRUEFALSE";
    if(["fill_blank","fill","fill_blank_text"].includes(t)) return "FILL";
    if(["matching","match"].includes(t)) return "MATCH";
    if(["ordering","order","sort"].includes(t)) return "SORT";
    if(["short","short_answer"].includes(t)) return "SHORT";
    if(["image"].includes(t)) return "IMAGE";
    if(["reading"].includes(t)) return "READING";
    if(["audio"].includes(t)) return "AUDIO";
    return "MCQ";
}

function optionValue(opt, fallback){
    if(opt && typeof opt === "object"){
        return String(opt.value ?? opt.id ?? fallback);
    }
    return String(opt ?? fallback);
}

function optionLabel(opt){
    if(opt && typeof opt === "object"){
        return String(opt.label ?? opt.text ?? opt.value ?? "");
    }
    return String(opt ?? "");
}

function normalizeQuestion(q, index){
    q = q || {};

    const type = normalizeType(q.type ?? q.loai);

    let options = Array.isArray(q.options) ? q.options : [];

    // Hỗ trợ ngân hàng cũ trong quá trình chuyển đổi.
    if(!options.length){
        options = ["A","B","C","D"]
            .filter(k => q[k] !== undefined && q[k] !== "")
            .map(k => ({value:k, label:String(q[k])}));
    }

    let correctValues = Array.isArray(q.correctValues)
        ? q.correctValues.map(String)
        : (
            q.correctValue != null
                ? [String(q.correctValue)]
                : (
                    q.dapAn != null
                        ? (Array.isArray(q.dapAn) ? q.dapAn.map(String) : [String(q.dapAn)])
                        : []
                )
        );

    // Chuẩn hóa Đúng/Sai cũ A/B hoặc D/S.
    if(type === "TRUEFALSE"){
        const a = String(correctValues[0] ?? "").trim().toLowerCase();
        correctValues = [
            ["true","d","a"].includes(a) ? "A" : "B"
        ];
        if(!correctValues[0]) correctValues = ["A"];
        options = [
            {value:"A", label:"Đúng"},
            {value:"B", label:"Sai"}
        ];
    }

    // MATCH chuẩn mới: options = [{value,left,right}], correctValues = ["A","B",...]
    if(type === "MATCH"){
        if(!options.length && Array.isArray(q.pairs)){
            options = q.pairs.map((p,i) => ({
                value: String.fromCharCode(65+i),
                left: p.left ?? "",
                right: p.right ?? ""
            }));
        }
        options = options.map((p,i) => {
            if(p && typeof p === "object"){
                return {
                    value: String(p.value ?? String.fromCharCode(65+i)),
                    left: String(p.left ?? p.label ?? p.text ?? ""),
                    right: String(p.right ?? "")
                };
            }
            return {
                value: String.fromCharCode(65+i),
                left: String(p),
                right: ""
            };
        });
    }

    // SORT chuẩn mới: options = [{value,label}], correctValues = ["A","B",...]
    if(type === "SORT"){
        if(!options.length && Array.isArray(q.items)){
            options = q.items.map((p,i) => ({
                value: String.fromCharCode(65+i),
                label: optionLabel(p)
            }));
        }
        options = options.map((p,i) => ({
            value: optionValue(p, String.fromCharCode(65+i)),
            label: optionLabel(p)
        }));
    }

    return {
        id: String(q.id ?? q.maCau ?? `Q-${index+1}`),
        type,
        question: String(q.question ?? q.cauHoi ?? ""),
        options,
        correctValues,
        hint: String(q.hint ?? ""),
        mucDo: String(q.mucDo ?? q.doKho ?? ""),
        mucDoPhanHoa: String(q.mucDoPhanHoa ?? q.mucDo ?? q.doKho ?? ""),
        chuDe: String(q.chuDe ?? ""),
        mon: String(q.mon ?? ""),
        phamVi: String(q.phamVi ?? ""),
        diem: Number(q.diem ?? 1) || 1,
        image: String(q.image ?? q.hinhAnh ?? q.anh ?? "")
    };
}

function normalizeBank(data){
    let list = [];

    if(Array.isArray(data)) list = data;
    else if(data && Array.isArray(data.cauHoi)) list = data.cauHoi;
    else if(data && Array.isArray(data.questions)) list = data.questions;

    return {
        thongTin: data?.thongTin || {},
        cauHoi: list.map(normalizeQuestion)
    };
}

async function loadQuestionBank(){
    const path = getBankPath();

    if(!path){
        nganHang = {thongTin:{}, cauHoi:[]};
        selectedIds.clear();
        renderQuestions();
        return;
    }

    try{
        const response = await fetch(path + "?v=" + Date.now());
        if(!response.ok) throw new Error(`HTTP ${response.status}`);

        const code = await response.text();

        const fn = new Function(`
            ${code}
            return typeof nganHangDe !== "undefined"
                ? nganHangDe
                : (typeof cauHoi !== "undefined" ? {cauHoi:cauHoi} : []);
        `);

        nganHang = normalizeBank(fn());
        selectedIds.clear();
        renderQuestions();

    }catch(error){
        console.error(error);
        nganHang = {thongTin:{}, cauHoi:[]};
        renderQuestions();

        alert(
            "Không tải được ngân hàng câu hỏi.\n\n" +
            path +
            "\n\n" +
            "Kiểm tra file theo cấu trúc:\n" +
            "nganhang/mon/mon-khoi.js"
        );
    }
}

function getQuestionTitle(q){
    return q.question || "Câu hỏi";
}

function getTypeName(type){
    return TYPE_NAMES[type] || type || "MCQ";
}


function renderMathJax(root){
    root = root || document.body;

    let attempts = 0;
    const maxAttempts = 100;

    function run(){
        attempts++;

        if(window.MathJax && typeof MathJax.typesetPromise === "function"){
            const ready = MathJax.startup && MathJax.startup.promise
                ? MathJax.startup.promise
                : Promise.resolve();

            ready.then(function(){
                return MathJax.typesetPromise([root]);
            }).catch(function(error){
                console.error("Lỗi MathJax:", error);
            });
            return;
        }

        if(attempts < maxAttempts){
            setTimeout(run, 50);
        }else{
            console.warn("MathJax chưa sẵn sàng sau 5 giây.");
        }
    }

    run();
}

function renderQuestions(){
    const tbody = document.getElementById("questionTable");
    const search = document.getElementById("searchInput").value.toLowerCase().trim();
    const filter = document.getElementById("filterType").value;

    const list = nganHang.cauHoi.filter(q => {
        const text = JSON.stringify(q).toLowerCase();
        return (!search || text.includes(search))
            && (!filter || q.type === filter);
    });

    if(!list.length){
        tbody.innerHTML = `
            <tr><td colspan="7">
                <div class="empty">
                    📭 Chưa có câu hỏi
                    <br><br>
                    Chọn môn + khối hoặc tạo câu hỏi mới.
                </div>
            </td></tr>`;
        updateStats();
        return;
    }

    tbody.innerHTML = "";

    list.forEach(q => {
        const index = nganHang.cauHoi.indexOf(q);
        const checked = selectedIds.has(q.id) ? "checked" : "";

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>
                <input type="checkbox" ${checked}
                    onchange="toggleSelect('${escapeAttr(q.id)}', this.checked)">
            </td>
            <td><strong>${escapeHtml(q.id)}</strong></td>
            <td>${escapeHtml(getQuestionTitle(q))}</td>
            <td><span class="badge">${escapeHtml(getTypeName(q.type))}</span></td>
            <td>${escapeHtml(q.chuDe || "—")}</td>
            <td>${q.diem}</td>
            <td>
                <button class="btn-primary" onclick="previewQuestion(${index})">👁</button>
                <button class="btn-warning" onclick="editQuestion(${index})">✏</button>
                <button class="btn-danger" onclick="deleteQuestion(${index})">🗑</button>
            </td>
        `;
        tbody.appendChild(row);
    });

    /* Render công thức Toán trong bảng sau khi đã tạo DOM. */
    renderMathJax(tbody);

    updateStats();
}

function updateStats(){
    const list = nganHang.cauHoi;

    document.getElementById("totalCount").textContent = list.length;
    document.getElementById("mcqCount").textContent =
        list.filter(q => q.type === "MCQ").length;
    document.getElementById("specialCount").textContent =
        list.filter(q => ["MULTI","TRUEFALSE","FILL","MATCH","SORT","SHORT","IMAGE","READING","AUDIO"].includes(q.type)).length;
    document.getElementById("selectedCount").textContent = selectedIds.size;
}

function toggleSelect(id, checked){
    if(checked) selectedIds.add(id);
    else selectedIds.delete(id);
    updateStats();
}

function toggleAll(checked){
    nganHang.cauHoi.forEach(q => {
        if(checked) selectedIds.add(q.id);
        else selectedIds.delete(q.id);
    });
    renderQuestions();
}

function saveQuestion(){
    const monUI = document.getElementById("selectMon").value;
    const khoi = document.getElementById("selectKhoi").value;

    if(!monUI || !khoi){
        alert("Vui lòng chọn môn và khối trước.");
        return;
    }

    const type = document.getElementById("questionType").value;
    const question = document.getElementById("questionText").value.trim();

    if(!question){
        alert("Vui lòng nhập câu hỏi.");
        return;
    }

    const old = editingIndex >= 0 ? nganHang.cauHoi[editingIndex] : null;

    const q = {
        id: old?.id || generateQuestionId(monUI, khoi),
        type,
        question,
        options: [],
        correctValues: [],
        hint: getValue("questionHint"),
        mucDo: document.getElementById("questionDifficulty").value,
        mucDoPhanHoa: document.getElementById("questionDifficulty").value,
        chuDe: getValue("questionTopic"),
        mon: getBankSubject(monUI),
        phamVi: getValue("questionScope"),
        diem: Number(document.getElementById("questionScore").value) || 1,
        image: getValue("questionImage")
    };

    if(type === "MCQ" || type === "MULTI"){
        q.options = ["A","B","C","D"]
            .map(v => ({value:v, label:getValue("option"+v)}))
            .filter(x => x.label !== "");

        if(type === "MCQ"){
            q.correctValues = [
                document.getElementById("correctAnswer").value
            ];
        }else{
            q.correctValues = Array.from(
                document.querySelectorAll(".multiAnswer:checked")
            ).map(x => x.value);

            if(!q.correctValues.length){
                alert("Hãy chọn ít nhất một đáp án đúng.");
                return;
            }
        }
    }

    if(type === "TRUEFALSE"){
        q.options = [
            {value:"A", label:"Đúng"},
            {value:"B", label:"Sai"}
        ];
        q.correctValues = [
            document.getElementById("trueFalseAnswer").value
        ];
    }

    if(type === "FILL"){
        const answer = getValue("fillAnswer");
        q.correctValues = answer.split("|").map(x => x.trim()).filter(Boolean);
        if(!q.correctValues.length){
            alert("Nhập ít nhất một đáp án.");
            return;
        }
    }

    if(type === "MATCH"){
        const lines = getValue("matchPairs")
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);

        const pairs = [];

        lines.forEach((line, i) => {
            const parts = line.split("|");
            if(parts.length >= 2){
                pairs.push({
                    value: String.fromCharCode(65+i),
                    left: parts[0].trim(),
                    right: parts.slice(1).join("|").trim()
                });
            }
        });

        if(pairs.length < 2){
            alert("Cần ít nhất 2 cặp ghép nối.");
            return;
        }

        q.options = pairs;
        q.correctValues = pairs.map(x => x.value);
    }

    if(type === "SORT"){
        const items = getValue("sortItems")
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);

        if(items.length < 2){
            alert("Cần ít nhất 2 mục để sắp xếp.");
            return;
        }

        q.options = items.map((label, i) => ({
            value: String.fromCharCode(65+i),
            label
        }));
        q.correctValues = q.options.map(x => x.value);
    }

    if(editingIndex >= 0) nganHang.cauHoi[editingIndex] = q;
    else nganHang.cauHoi.push(q);

    renderQuestions();
    closeModal();
    editingIndex = -1;

    alert("Đã lưu câu hỏi theo cấu trúc mới.\n\nHãy bấm 'Xuất JS' để tải ngân hàng.");
}

function editQuestion(index){
    const q = nganHang.cauHoi[index];
    editingIndex = index;

    document.getElementById("modalTitle").textContent = "Sửa câu hỏi";
    document.getElementById("questionType").value = q.type || "MCQ";
    document.getElementById("questionText").value = q.question || "";
    document.getElementById("questionScore").value = q.diem ?? 1;
    document.getElementById("questionTopic").value = q.chuDe || "";
    document.getElementById("questionDifficulty").value = q.mucDoPhanHoa || q.mucDo || "Nhận biết";
    document.getElementById("questionHint").value = q.hint || "";
    document.getElementById("questionScope").value = q.phamVi || "";
    document.getElementById("questionImage").value = q.image || "";

    changeQuestionType();

    if(q.type === "MCQ" || !q.type){
        (q.options || []).forEach(o => {
            setValue("option"+optionValue(o, ""), optionLabel(o));
        });
        const el = document.getElementById("correctAnswer");
        if(el) el.value = q.correctValues?.[0] || "A";
    }

    if(q.type === "MULTI"){
        (q.options || []).forEach(o => {
            setValue("option"+optionValue(o, ""), optionLabel(o));
        });
        const answers = q.correctValues || [];
        document.querySelectorAll(".multiAnswer").forEach(x => {
            x.checked = answers.includes(x.value);
        });
    }

    if(q.type === "TRUEFALSE"){
        const el = document.getElementById("trueFalseAnswer");
        if(el) el.value = q.correctValues?.[0] || "A";
    }

    if(q.type === "FILL"){
        setValue("fillAnswer", (q.correctValues || []).join("|"));
    }

    if(q.type === "MATCH"){
        setValue("matchPairs", (q.options || [])
            .map(x => `${x.left || ""} | ${x.right || ""}`)
            .join("\n"));
    }

    if(q.type === "SORT"){
        setValue("sortItems", (q.options || []).map(x => optionLabel(x)).join("\n"));
    }

    document.getElementById("createModal").classList.add("show");
}

function deleteQuestion(index){
    const q = nganHang.cauHoi[index];

    if(!confirm("Xóa câu " + (q.id || "") + "?")) return;

    nganHang.cauHoi.splice(index, 1);
    selectedIds.delete(q.id);
    renderQuestions();
}

        </div>`;

    box.innerHTML = html;

    /* Render công thức trong cửa sổ xem trước. */
    renderMathJax(box);

function importExcel(){
    document.getElementById("excelInput").click();
}

document.getElementById("excelInput").addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = e => {
        const rows = parseCSV(e.target.result);

        if(rows.length < 2){
            alert("File CSV không có dữ liệu.");
            return;
        }

        const headers = rows[0].map(x => x.trim().toLowerCase());
        let count = 0;

        const get = (row, ...names) => {
            for(const name of names){
                const i = headers.indexOf(name);
                if(i >= 0) return (row[i] || "").trim();
            }
            return "";
        };

        for(let i=1; i<rows.length; i++){
            const row = rows[i];
            const question = get(row, "question", "cauhoi", "câu hỏi");
            if(!question) continue;

            const monUI = document.getElementById("selectMon").value;
            const khoi = document.getElementById("selectKhoi").value;
            const type = normalizeType(get(row, "type", "loai"));

            const q = {
                id: get(row, "id", "macau", "mã câu") || generateQuestionId(monUI, khoi),
                type,
                question,
                options: [],
                correctValues: [],
                hint: get(row, "hint"),
                mucDo: get(row, "mucdo", "dokho", "độ khó"),
                mucDoPhanHoa: get(row, "mucdophanhhoa"),
                chuDe: get(row, "chude", "chủ đề"),
                mon: getBankSubject(monUI),
                phamVi: get(row, "phamvi"),
                diem: Number(get(row, "diem")) || 1,
                image: get(row, "image", "hinhanh", "anh")
            };

            ["A","B","C","D"].forEach(v => {
                const label = get(row, v.toLowerCase());
                if(label) q.options.push({value:v, label});
            });

            const correct = get(row, "correctvalues", "correctvalue", "dapan", "đáp án");
            q.correctValues = correct
                ? correct.split(/[,;|]+/).map(x => x.trim()).filter(Boolean)
                : [];

            if(type === "MATCH"){
                const pairs = get(row, "options", "pairs")
                    .split(/\s*;\s*/)
                    .filter(Boolean);

                q.options = pairs.map((p,i) => {
                    const [left, ...right] = p.split("|");
                    return {
                        value: String.fromCharCode(65+i),
                        left: left.trim(),
                        right: right.join("|").trim()
                    };
                });

                if(!q.correctValues.length)
                    q.correctValues = q.options.map(x => x.value);
            }

            if(type === "SORT"){
                const items = get(row, "options", "items")
                    .split(/\s*;\s*/)
                    .map(x => x.trim())
                    .filter(Boolean);

                q.options = items.map((label,i) => ({
                    value: String.fromCharCode(65+i),
                    label
                }));

                if(!q.correctValues.length)
                    q.correctValues = q.options.map(x => x.value);
            }

            nganHang.cauHoi.push(q);
            count++;
        }

        renderQuestions();
        alert("Đã import " + count + " câu hỏi theo cấu trúc mới.");
        this.value = "";
    };

    reader.readAsText(file, "UTF-8");
});

function parseCSV(text){
    const rows = [];
    let row = [], value = "", insideQuotes = false;

    for(let i=0; i<text.length; i++){
        const char = text[i];
        const next = text[i+1];

        if(char === '"' && insideQuotes && next === '"'){
            value += '"'; i++; continue;
        }

        if(char === '"'){
            insideQuotes = !insideQuotes; continue;
        }

        if(char === "," && !insideQuotes){
            row.push(value); value = ""; continue;
        }

        if((char === "\n" || char === "\r") && !insideQuotes){
            if(char === "\r" && next === "\n") i++;
            row.push(value); value = "";
            if(row.length) rows.push(row);
            row = [];
            continue;
        }

        value += char;
    }

    if(value || row.length){
        row.push(value);
        rows.push(row);
    }

    return rows;
}

function getSubjectName(mon){
    const map = {
        toan:"Toán",
        van:"Ngữ văn",
        tienganh:"Tiếng Anh",
        lichsu:"Lịch sử",
        dialy:"Địa lí",
        khtn:"Khoa học tự nhiên"
    };
    return map[mon] || mon;
}

function generateQuestionId(mon, khoi){
    const prefix = getBankSubject(mon).toUpperCase() + khoi;
    let max = 0;

    nganHang.cauHoi.forEach(q => {
        const m = String(q.id || "").match(/(\d+)$/);
        if(m) max = Math.max(max, Number(m[1]));
    });

    return prefix + "-" + String(max + 1).padStart(4,"0");
}

function getValue(id){
    const el = document.getElementById(id);
    return el ? el.value.trim() : "";
}

function setValue(id, value){
    const el = document.getElementById(id);
    if(el) el.value = value ?? "";
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttr(value){
    return String(value ?? "")
        .replace(/'/g,"&#039;")
        .replace(/"/g,"&quot;");
}

document.addEventListener("DOMContentLoaded", () => {
    renderQuestions();
    changeQuestionType();
});
